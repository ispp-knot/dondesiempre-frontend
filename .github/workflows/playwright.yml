name: Playwright Tests
on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4 # Repo Frontend

    # 1. Clonamos el backend primero para que exista la carpeta y el pom.xml
    - name: Clone Backend
      run: |
        git clone https://github.com/ispp-knot/dondesiempre-backend.git backend
        cd backend
        cp .env.example .env
        docker compose up -d
        chmod +x mvnw

    # 2. Ahora instalamos Java 25 apuntando a la carpeta clonada para la caché
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'
        # Indicamos dónde está el pom.xml para que la caché no falle
        mvnd-relative-path: 'backend' 

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'

    - name: Install & Build Frontend
      run: |
        npm ci
        npm run build

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: npx playwright test
      # Los servidores se levantan solos gracias al config de Playwright

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30