name: Playwright Tests
on:
  pull_request:
    branches: [ main ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build

    - name: Start Frontend
      run: npm run start 

    - name: Clone Backend
      run: |
        git clone https://github.com/ispp-knot/dondesiempre-backend.git backend
    
    - name: Install & Start Backend
      run: |
        cd backend
        cp .env.example .env
        docker compose up -d
        ./mvnw spring-boot:run "-Dspring-boot.run.profiles=dev-migration,seed"
        ./mvnw spring-boot:run "-Dspring-boot.run.profiles=dev-migration"
        "backend\mvnw.cmd" install -f "backend\pom.xml"
        npx wait-on http://localhost:8080 # Esperas a que el puerto de la API esté vivo


    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
